name: Build and localization checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build and check Turkish and English resources
        shell: powershell
        run: .\tests\RunChecks.ps1 -Configuration Release
